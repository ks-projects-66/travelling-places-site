# Sveltia CMS configuration.
#
# Staff edit at /admin/. Every save is a commit to this repository, which triggers a
# Cloudflare Pages rebuild. No database, no licence, no monthly cost.
#
# BEFORE THIS WORKS, two things must exist. Neither has been done, because both create
# accounts in the business's name. See docs/DEPLOY.md, "Content management".
#   1. A GitHub OAuth app, with its callback pointing at the auth worker below.
#   2. The sveltia-cms-auth Cloudflare Worker deployed, holding that app's client secret.
# Replace base_url with the worker's address once it is live.

backend:
  name: github
  repo: ks-projects-66/travelling-places-site
  branch: main
  base_url: https://TODO-auth-worker.workers.dev
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'
    uploadMedia: 'Add image "{{path}}"'
    deleteMedia: 'Delete image "{{path}}"'

# Editors upload into the journal folder. Everything else is developer-managed, because
# team portraits and membership marks carry approval and licensing rules that a CMS
# upload box cannot enforce. See src/assets/images/MANIFEST.md.
media_folder: src/assets/images/journal
public_folder: /src/assets/images/journal

publish_mode: simple
site_url: https://travellingplaces.com.au
logo_url: /images/brand/logo-mark.svg

collections:
  - name: legal
    label: Legal
    files:
      - name: privacy
        label: Privacy policy
        file: src/content/legal/privacy.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: approved, label: Approved by a person with authority, widget: boolean, default: false, hint: 'Leave off until every TODO is resolved and the policy is signed off. While off, the page says it is an unapproved draft.' }
          - { name: drafted, label: Drafted, widget: datetime, date_format: 'DD MMMM YYYY', time_format: false, picker_utc: false }
          - { name: approvedOn, label: Approved on, widget: datetime, date_format: 'DD MMMM YYYY', time_format: false, picker_utc: false, required: false }
          - { name: body, label: Policy, widget: markdown, hint: 'Each red TODO is a fact only the business can supply. See docs/PRIVACY-NOTES.md.' }

  - name: journal
    label: Journal
    label_singular: Article
    folder: src/content/journal
    create: true
    slug: '{{slug}}'
    preview_path: journal/{{slug}}
    sortable_fields: [date, title]
    summary: '{{title}} — {{year}}-{{month}}-{{day}}'
    fields:
      - { name: title, label: Headline, widget: string }
      - name: standfirst
        label: Standfirst
        widget: text
        hint: One or two sentences. Appears under the headline and in listings.
      - name: category
        label: Category
        widget: select
        options: [Expedition travel, River cruising, Ocean cruising, Touring, Luxury travel, Travel planning, Our story]
      - { name: date, label: Date, widget: datetime, date_format: 'DD MMMM YYYY', time_format: false, picker_utc: false }
      - { name: author, label: Written by, widget: string, default: Travelling Places }
      - { name: authorRole, label: Author's role, widget: string, required: false }
      - { name: readingTime, label: Reading time, widget: string, required: false, hint: 'For example: 5 min read' }
      - name: cover
        label: Cover image
        widget: image
        hint: Landscape works best. 16:9 is the house ratio for journal images.
      - { name: coverAlt, label: Cover image description, widget: string, hint: Describe the photograph for someone who cannot see it. }
      - { name: featured, label: Feature at the top of the journal, widget: boolean, default: false }
      - name: externalUrl
        label: Link to an article on another site
        widget: string
        required: false
        hint: Leave empty to write the article here. Fill it in to link out instead.
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }

  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    create: true
    slug: '{{slug}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Job title, widget: string }
      - { name: order, label: Order on the page, widget: number, value_type: int, min: 1 }
      - { name: founder, label: Founder, widget: boolean, default: false }
      - { name: portrait, label: Portrait, widget: image, required: false }
      - { name: portraitAlt, label: Portrait description, widget: string, required: false }
      - name: approved
        label: Title and bio approved by this person
        widget: boolean
        default: false
        hint: Leave off until they have read and approved it. A warning shows on the site while this is off.
      - { name: body, label: Biography, widget: markdown }

  - name: services
    label: Expertise
    label_singular: Service
    folder: src/content/services
    create: true
    slug: '{{slug}}'
    fields:
      - { name: label, label: Service name, widget: string }
      - { name: title, label: Headline, widget: string, hint: 'Not shown on the site since 1 November 2026. Kept so the text is not lost.' }
      - { name: summary, label: One-line summary, widget: string, hint: Used on the home page list. }
      - { name: order, label: Order, widget: number, value_type: int, min: 1 }
      - { name: anchor, label: Anchor, widget: string, hint: 'Lowercase, no spaces. Forms the link, e.g. cruising.' }
      - { name: points, label: What we cover, widget: list, hint: 'Not shown on the site since 1 November 2026. Kept so the text is not lost.', field: { name: point, label: Point, widget: string } }
      - { name: image, label: Photo file, widget: string, required: false, hint: 'Path under src/assets/images, e.g. features/expedition-penguins.jpg. Needs a MANIFEST.md row first.' }
      - { name: imageAlt, label: Photo description, widget: string, required: false, hint: Describe the photograph for someone who cannot see it. }
      - { name: imagePosition, label: Photo crop position, widget: string, required: false, hint: 'CSS position, e.g. center 60%. Leave blank for centre.' }
      - name: link
        label: Link
        widget: object
        required: false
        hint: Shown under the card on Tailor-made. A full web address opens in a new tab.
        fields:
          - { name: label, label: Link text, widget: string }
          - { name: href, label: Link address, widget: string }
      - { name: body, label: Description, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Contact details and identifiers
        file: src/data/site.json
        fields:
          - { name: name, label: Business name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Search description, widget: text }
          - { name: founded, label: Year founded, widget: number, value_type: int }
          - { name: phone, label: Phone (display), widget: string }
          - { name: phoneInternational, label: Phone (international format), widget: string }
          - { name: phoneLink, label: Phone (link), widget: string, hint: 'Format: tel:+61755451600' }
          - { name: email, label: Email, widget: string }
          - name: address
            label: Address
            widget: object
            fields:
              - { name: street, label: Street, widget: string }
              - { name: locality, label: Suburb, widget: string }
              - { name: region, label: State, widget: string }
              - { name: postcode, label: Postcode, widget: string }
              - { name: country, label: Country code, widget: string }
              - { name: mapUrl, label: Google Maps link, widget: string }
          - name: openingHours
            label: Trading hours
            widget: object
            fields:
              - { name: value, label: Hours, widget: string }
              - { name: status, label: Status, widget: select, options: [confirmed, placeholder] }
          - name: socials
            label: Social profiles
            widget: object
            fields:
              - name: instagram
                label: Instagram
                widget: object
                fields:
                  - { name: url, label: URL, widget: string }
                  - { name: status, label: Status, widget: select, options: [confirmed, unconfirmed] }
                  - { name: note, label: Note, widget: text, required: false }
              - name: facebook
                label: Facebook
                widget: object
                fields:
                  - { name: url, label: URL, widget: string }
                  - { name: status, label: Status, widget: select, options: [confirmed, unconfirmed] }
                  - { name: note, label: Note, widget: text, required: false }
          - name: virtuoso
            label: Virtuoso profile
            widget: object
            fields:
              - { name: profileUrl, label: Profile URL, widget: string }
              - { name: status, label: Status, widget: select, options: [confirmed, unconfirmed] }
              - { name: note, label: Note, widget: text, required: false }
          - name: identifiers
            label: Business identifiers
            widget: object
            fields:
              - name: abn
                label: ABN
                widget: object
                fields:
                  - { name: value, label: Value, widget: string }
                  - { name: status, label: Status, widget: select, options: [confirmed, placeholder] }
              - name: atiaAccreditation
                label: ATIA accreditation number
                widget: object
                fields:
                  - { name: value, label: Value, widget: string }
                  - { name: status, label: Status, widget: select, options: [confirmed, placeholder] }
              - name: cliaMembership
                label: CLIA membership number
                widget: object
                fields:
                  - { name: value, label: Value, widget: string }
                  - { name: status, label: Status, widget: select, options: [confirmed, placeholder] }

  # Gina's page copy, supplied 25 September 2026. Each file keeps her wording; headings marked
  # editorial in a file's `source` note were added to lay the page out.
  - name: page_copy
    label: Page copy
    files:
      - name: about
        label: About us
        file: src/data/about.json
        fields:
          - { name: source, label: Source note, widget: text }
          - { name: metaDescription, label: Search description, widget: string, hint: About 155 characters. }
          - name: hero
            label: Opening
            widget: object
            fields:
              - { name: lead, label: Title, first line, widget: string }
              - { name: accent, label: Title, second line, widget: string }
              - { name: lede, label: Introduction, widget: text }
              - { name: imageAlt, label: Photograph description, widget: string }
          - name: intro
            label: About Travelling Places
            widget: object
            fields: &section
              - { name: heading, label: Heading, widget: string }
              - { name: paragraphs, label: Paragraphs, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
          - name: story
            label: Our story
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: image, label: Photo file, widget: string, required: false, hint: 'Path under src/assets/images, e.g. team/team-office.jpg. Needs a MANIFEST.md row first.' }
              - { name: imageAlt, label: Photo description, widget: string, required: false, hint: Describe the photograph for someone who cannot see it. }
              - { name: imagePosition, label: Photo crop position, widget: string, required: false, hint: 'CSS position, e.g. center 30%. Leave blank for centre.' }
              - { name: paragraphs, label: Paragraphs, widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
              - { name: quote, label: Gina's quotation, widget: text, required: false, hint: One sentence in Gina's own words. Leave empty and the page shows a TODO marker. }
      - name: tailor_made
        label: Tailor-made and luxury holidays
        file: src/data/tailor-made.json
        fields:
          - { name: source, label: Source note, widget: text }
          - { name: heading, label: Page title, widget: string }
          - { name: heroLead, label: Opening title, first line, widget: string }
          - { name: heroAccent, label: Opening title, second line, widget: string }
          - { name: intro, label: Opening paragraph, widget: text }
          - { name: sections, label: Sections, widget: list, fields: *section }
          - { name: servicesHeading, label: Heading above the services, widget: string, required: false }
      - name: luxury
        label: Luxury travel
        file: src/data/luxury.json
        fields:
          - { name: source, label: Source note, widget: text }
          - { name: title, label: Page title, widget: string }
          - { name: heroLead, label: Hero heading line 1, widget: string, hint: 'Keep each line to 18 characters so it holds two lines on phones.' }
          - { name: heroAccent, label: Hero heading line 2, widget: string }
          - { name: heroLede, label: Hero subtitle, widget: string }
          - { name: intro, label: Introduction, widget: object, fields: *section }
          - name: themes
            label: Themes
            hint: Three themes, each a photo, a heading and one or two sentences.
            widget: list
            fields:
              - { name: title, label: Theme heading, widget: string }
              - { name: photo, label: Photo placeholder note, widget: string }
              - { name: image, label: Photo file, widget: string, required: false, hint: 'Path under src/assets/images, e.g. features/expedition-penguins.jpg. Needs a MANIFEST.md row first.' }
              - { name: imageAlt, label: Photo description, widget: string, required: false, hint: Describe the photograph for someone who cannot see it. }
              - { name: imagePosition, label: Photo crop position, widget: string, required: false, hint: 'CSS position, e.g. center 60%. Leave blank for centre.' }
              - { name: body, label: Text, widget: text }
              - name: link
                label: Link
                widget: object
                required: false
                fields:
                  - { name: label, label: Link text, widget: string }
                  - { name: href, label: Link address, widget: string }
      - name: virtuoso
        label: Virtuoso
        file: src/data/virtuoso.json
        fields:
          - { name: source, label: Source note, widget: text }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Text, widget: text }
          - name: pillars
            label: Pillars
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Text, widget: text }
          - { name: homeButton, label: Home page button, widget: string, hint: Goes to the Virtuoso band on the Luxury page. }
          - { name: profileLead, label: Luxury page invitation, widget: text }
          - { name: profileLink, label: Luxury page link text, widget: string, hint: 'The address is set once, under Contact details and identifiers, Virtuoso profile.' }
          - name: held
            label: Gina's original section (not shown)
            widget: object
            hint: Kept for the record. Not shown on the site.
            fields:
              - { name: source, label: Source note, widget: text }
              - { name: intro, label: Introduction, widget: object, fields: *section }
              - name: benefits
                label: Benefits
                widget: list
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Text, widget: text }
      - name: home
        label: Home page
        file: src/data/home.json
        fields:
          - { name: source, label: Source note, widget: text }
          - name: hero
            label: Opening
            widget: object
            fields:
              - { name: lead, label: Title, first line, widget: string }
              - { name: accent, label: Title, second line, widget: string }
              - { name: lede, label: Introduction, widget: text }
              - { name: primary, label: Button, widget: string }
              - { name: secondary, label: Link, widget: string }
          - name: intro
            label: Introduction
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: lead, label: Lead, widget: text }
              - { name: detail, label: Detail, widget: text }
              - { name: link, label: Link text, widget: string }
          - name: journeys
            label: Journeys
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: cards
                label: Cards
                widget: list
                fields:
                  - { name: service, label: Service entry, widget: select, options: [cruising, expeditions, luxury, tailor-made], hint: The photograph comes from this service. }
                  - { name: label, label: Title, widget: string }
                  - { name: body, label: Paragraph, widget: text, hint: About 30 to 45 words. }
                  - { name: points, label: What it includes, widget: list, hint: Three or four short items., field: { name: point, label: Item, widget: string } }
                  - { name: link, label: Link text, widget: string }
                  - { name: href, label: Link address, widget: string }
                  - { name: hrefStatus, label: Link status, widget: select, options: [confirmed, placeholder] }
                  - { name: hrefNote, label: Link note, widget: string, required: false }
          - name: about
            label: About introduction
            widget: object
            hint: The heading and paragraph come from the About us file, introduction.
            fields:
              - { name: caption, label: Photograph caption, widget: string }
              - { name: imageAlt, label: Photograph description, widget: string }
              - { name: link, label: Link text, widget: string }
          - name: journal
            label: Journal
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Introduction, widget: string }
              - { name: allLink, label: Link to the journal, widget: string }
      - name: why_book
        label: Why book with Travelling Places
        file: src/data/why-book.json
        fields:
          - { name: source, label: Source note, widget: text }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: contactLead, label: Text before the phone number, widget: string }
          - { name: contactMiddle, label: Text between phone and email, widget: string }
          - name: services
            label: Services
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: points, label: Services, widget: list, field: { name: point, label: Service, widget: string } }
          - { name: proof, label: Credentials, widget: list, field: { name: item, label: Credential, widget: string } }
          - name: promises
            label: Our four promises
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Paragraph, widget: text, hint: About 35 to 40 words, so the four read as a set. }
              - { name: paragraphs, label: Original paragraphs, widget: list, hint: "Gina's full text, kept for reference. Not shown on the page.", field: { name: paragraph, label: Paragraph, widget: text } }
          - { name: cta, label: Button, widget: string }
      - name: top_bar
        label: Newsletter sign-up
        file: src/data/top-bar.json
        fields:
          - { name: source, label: Source note, widget: text }
          - name: newsletter
            label: Newsletter
            widget: object
            fields:
              - { name: button, label: Button text, widget: string }
              - { name: heading, label: Form heading, widget: string }
              - { name: magazineLabel, label: Magazine opt-in text, widget: string }
              - { name: footerLine, label: Footer line, widget: string }
              - { name: footerButton, label: Footer button text, widget: string }
