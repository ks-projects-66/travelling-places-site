<section class="tp-carousel" aria-label="Featured journeys" data-carousel>
  <div class="tp-carousel-viewport">
    <article class="tp-carousel-slide is-active" data-slide>
      <img src="/brand-kit-v2/assets/images/mediterranean.webp" alt="A Mediterranean coastline in warm evening light" />
      <div class="tp-carousel-caption"><h3>Travel at a pace that feels entirely your own.</h3></div>
    </article>
    <article class="tp-carousel-slide" data-slide aria-hidden="true">
      <img src="/brand-kit-v2/assets/images/antarctica.webp" alt="Ice and mountains across an Antarctic landscape" />
      <div class="tp-carousel-caption"><h3>Remote places, made possible through trusted expertise.</h3></div>
    </article>
    <article class="tp-carousel-slide" data-slide aria-hidden="true">
      <img src="/brand-kit-v2/assets/images/cruise.webp" alt="A dining table set beside a wide ocean view aboard ship" />
      <div class="tp-carousel-caption"><h3>Every detail considered, from departure to return.</h3></div>
    </article>
  </div>
  <div class="tp-carousel-controls">
    <div class="tp-carousel-dots" aria-label="Choose a carousel image">
      <button class="tp-carousel-dot is-active" type="button" aria-label="Show Mediterranean journey" aria-pressed="true" data-carousel-dot="0"></button>
      <button class="tp-carousel-dot" type="button" aria-label="Show Antarctic journey" aria-pressed="false" data-carousel-dot="1"></button>
      <button class="tp-carousel-dot" type="button" aria-label="Show voyage dining" aria-pressed="false" data-carousel-dot="2"></button>
    </div>
    <div class="tp-carousel-actions">
      <button class="tp-icon-button" type="button" aria-label="Previous image" data-carousel-previous>
        <svg aria-hidden="true"><use href="/brand-kit-v2/assets/icons/ui-icons.svg#icon-chevron-left"></use></svg>
      </button>
      <button class="tp-icon-button" type="button" aria-label="Pause carousel" aria-pressed="false" data-carousel-pause>
        <svg aria-hidden="true"><use href="/brand-kit-v2/assets/icons/ui-icons.svg#icon-pause"></use></svg>
      </button>
      <button class="tp-icon-button" type="button" aria-label="Next image" data-carousel-next>
        <svg aria-hidden="true"><use href="/brand-kit-v2/assets/icons/ui-icons.svg#icon-chevron-right"></use></svg>
      </button>
    </div>
  </div>
</section>
